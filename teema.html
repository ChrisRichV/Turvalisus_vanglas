<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teema – Õppeleht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/stiil.css?v=20261111p">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f2c230'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' font-family='Georgia' fill='%231c2733'%3E§%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="ylariba" id="ylariba"></header>

<main id="leht"><p class="vahe tyhi" style="margin-top:2rem">Laen teemat…</p></main>

<footer class="jalus">
  <p>Seaduste ja lepingute tekstid: Riigi Teataja, EUR-Lex, ÜRO – muutmata kujul. Selgitused on õppimiseks ega asenda ametlikku teksti.</p>
</footer>

<script src="assets/seadistus.js?v=20261111p"></script>
<script src="assets/app.js?v=20261111p"></script>
<script src="assets/ikoonid.js?v=20261111p"></script>
<script src="assets/skeemid.js?v=20261111p"></script>
<script>
(function () {
  const A = window.APP;
  const leht = document.getElementById("leht");
  const id = new URLSearchParams(location.search).get("id");
  const li = (x) => `<li>${A.md(x)}</li>`;
  const ul = (a) => (a && a.length ? `<ul>${a.map(li).join("")}</ul>` : "");

  A.andmed().then(({ tunnid }) => {
    let tund = null, kirje = null, jrj = [];
    tunnid.tunnid.forEach((t) => t.teemad.forEach((tm) => { if (tm.id === id) { tund = t; kirje = tm; } }));
    // lehitsemine ainult sama aine sees (tund → järgmine tund)
    if (tund) tunnid.tunnid.filter((t) => t.aine === tund.aine).forEach((t) => t.teemad.forEach((tm) => jrj.push(Object.assign({ _tund: t }, tm))));
    if (kirje) kirje = jrj.find((x) => x.id === id);
    A.kaivita({ leht: "teema", aine: tund && tund.aine, tund: tund && tund.id, teema: id });
    if (!kirje) { leht.innerHTML = `<div class="vahe" style="padding-top:2rem"><h1>Teemat ei leitud</h1><p><a href="index.html">Tagasi tundide juurde</a></p></div>`; return; }
    const i = jrj.indexOf(kirje);
    return Promise.all([A.lae(kirje.fail), jrj[i - 1] ? A.lae(jrj[i - 1].fail) : null, jrj[i + 1] ? A.lae(jrj[i + 1].fail) : null])
      .then(([t, eel, jar]) => joonista(t, tund, eel && Object.assign({ _tund: jrj[i - 1]._tund }, eel), jar && Object.assign({ _tund: jrj[i + 1]._tund }, jar), { nr: tund.teemad.findIndex((x) => x.id === id) + 1, kokku: tund.teemad.length }));
  }).catch((e) => { A.kaivita({ leht: "teema" }); A.viga(leht, e); });

  function joonista(t, tund, eel, jar, asukoht) {
    document.title = `${t.pealkiri} – Õppeleht`;
    const aine = (A.tunnid.ained || []).find((a) => a.id === tund.aine) || { id: "", nimi: "", lyhend: "" };
    A.salvestaViimati({ id: t.id, pealkiri: t.pealkiri, aine: aine.lyhend });
    const o = t.osad;
    const lk = (x) => (x || "").split(/\n\n+/).map((y) => `<p>${A.md(y)}</p>`).join("");
    const sk = (x) => (x && x.skeem ? A.skeem(x.skeem) : "");
    const osad = [
      { id: "pohimote", nimi: o.pohimote.pealkiri || "Mis see on", html: () =>
          lk(o.pohimote.tekst) +
          (o.pohimote.tsitaat ? `<blockquote class="tsitaat">${A.esc(o.pohimote.tsitaat.tekst)}<cite>${A.esc(o.pohimote.tsitaat.viide)} – sõna-sõnalt</cite></blockquote>` : "") +
          ul(o.pohimote.punktid) + sk(o.pohimote) + lk(o.pohimote.jarel) },
      { id: "alus", nimi: o.alus.pealkiri || "Õiguslik alus", html: () => lk(o.alus.tekst) +
          `<div class="alused">${(o.alus.read || []).map((r) => `<div class="alus-rida"><div class="alus-tase">${A.esc(r.tase)}</div>
            <div class="alus-viited">${r.viited.map((v) => A.refNupp(v)).join("")}</div><div class="alus-tekst">${A.md(r.tekst)}</div></div>`).join("")}</div>` + sk(o.alus) },
      { id: "piiramine", nimi: o.piiramine.pealkiri || "Piiramine ja proportsionaalsus", html: () =>
          lk(o.piiramine.tekst) + ul(o.piiramine.punktid) + sk(o.piiramine) + lk(o.piiramine.jarel) },
      { id: "vangla", nimi: "Vanglas", html: () =>
          lk(o.vangla.tekst) + sk(o.vangla) + (o.vangla.naide ? `<div class="naide">
            <div class="olukord"><h3>Olukord</h3><p>${A.md(o.vangla.naide.olukord)}</p></div>
            <div><h3>Analüüs</h3><p>${A.md(o.vangla.naide.analyys)}</p></div></div>` : "") +
          (t.naited && t.naited.length ? `<p class="naide-rida">${naiteNupp(t, t.naited.length > 1 ? "Vaata päris juhtumeid" : "Vaata päris juhtumit")}</p>` : "") },
      { id: "tyypviga", nimi: "Tüüpviga eksamil", html: () => `<div class="tyypviga">${ul(o.tyypviga.punktid)}</div>` }
    ];
    const lisad = [
      ...(t.skeem && (!Array.isArray(t.skeem) || t.skeem.length) ? [{ id: "skeem", nimi: t.skeem_pealkiri || "Skeem", html: () => A.skeem(t.skeem) }] : []),
      ...(t.vastus && t.vastus.length ? [{ id: "vastus", nimi: "Tunni küsimus", html: () => t.vastus.map((v) =>
          `<div class="vastus-kast"><h3>Kordamisküsimus ${v.nr}</h3><div class="kysimus">${A.esc(A.kysTekst(tund, v.nr))}</div><h3 style="margin-top:.8rem">Vastus</h3>${ul(v.punktid)}</div>`).join("") }] : []),
      { id: "harjutused", nimi: "Harjuta", html: () => t.harjutused.map((h, k) => A.harjutusHtml(h, `h${k}`)).join("") }
    ];
    if ((t.erinevused && t.erinevused.length) || (t.valjast && t.valjast.length)) {
      lisad.push({ id: "allikad", nimi: "Allikate märkused", html: () =>
        (t.erinevused || []).map((e) => `<div class="erinevus"><h3>${A.md(e.teema)}</h3><dl>
          <dt>${A.esc(e.silt || "Konspekt")}</dt><dd>${A.md(e.konspekt)}</dd><dt>Ametlik tekst</dt><dd>${A.md(e.ametlik)}</dd>
          ${e.markus ? `<dt>Märkus</dt><dd>${A.md(e.markus)}</dd>` : ""}</dl></div>`).join("") +
        ((t.valjast || []).length ? `<div class="valjast"><p><strong>Väljastpoolt tunnimaterjali:</strong></p>${t.valjast.map((v) =>
          `<p>${A.md(v.tekst)} <em>(${A.esc(v.allikas)})</em></p>`).join("")}</div>` : "") });
    }
    const koik = osad.map((x, k) => ({ ...x, nr: k + 1 })).concat(lisad);
    const menyy = koik.map((x) => `<li><a href="#${x.id}">${x.nr ? x.nr + ". " : ""}${A.esc(x.nimi)}</a></li>`).join("");
    const sisu = koik.map((x) => `<section class="osa" id="${x.id}" aria-labelledby="${x.id}-p">
      <h2 id="${x.id}-p">${x.nr ? `<span class="onr">${x.nr}</span>` : ""}${A.esc(x.nimi)}</h2>${x.html()}</section>`).join("");
    const kys = !t.kysimused.length ? "" : t.kysimused.length > 1 ? `Kordamisküsimused ${t.kysimused.join(", ")}. ` : `Kordamisküsimus ${t.kysimused[0]}. `;
    const link = (x, klass, silt) => {
      if (!x) return "";
      const uusTund = x._tund.id !== tund.id;
      const s = uusTund ? (klass === "jargmine" ? `Järgmine tund ${x._tund.nr} · ${A.esc(x._tund.pealkiri)}` : `Eelmine tund ${x._tund.nr}`) : silt;
      return `<a class="${klass}" href="teema.html?id=${x.id}">${x.ikoon ? `<span class="l-ikoon">${A.ikoon(x.ikoon)}</span>` : ""}<span class="l-tekst"><small>${s}</small><b>${A.esc(x.pealkiri)}</b></span>${klass === "jargmine" ? '<span class="l-nool" aria-hidden="true">→</span>' : ""}</a>`;
    };
    const lopp = !jar ? `<a class="jargmine lopp" href="kordamine.html?tund=${tund.id}"><span class="l-tekst"><small>Tunni viimane teema</small><b>Korda kogu tundi</b></span><span class="l-nool" aria-hidden="true">→</span></a>` : "";
    const sammud = `<div class="lehitse-seis" aria-label="Teema ${asukoht.nr} / ${asukoht.kokku} selles tunnis">${Array.from({ length: asukoht.kokku }, (_, k) => `<i class="${k + 1 < asukoht.nr ? "tehtud" : k + 1 === asukoht.nr ? "praegu" : ""}"></i>`).join("")}<span>Teema ${asukoht.nr} / ${asukoht.kokku}</span></div>`;

    leht.innerHTML = `
      <header class="teema-pais">
        <div class="murupuru"><a href="index.html">Avaleht</a> / <a href="aine.html?id=${aine.id}">${A.esc(aine.nimi)}</a> / tund ${tund.nr}: ${A.esc(tund.pealkiri)} / teema ${t.jrk}</div>
        ${t.ikoon ? `<div class="teema-ikoon">${A.ikoon(t.ikoon)}</div>` : ""}
        <h1>${A.esc(t.pealkiri)}</h1>
        <p class="lyhidalt">${A.md(t.lyhidalt)}</p>
        <div class="nupurida">${naiteNupp(t, "Päris näide")}
          <p class="kys">${kys}<a href="kordamine.html?tund=${tund.id}&teema=${t.id}">Harjuta ainult seda teemat</a></p>
          <a class="kaardilink" href="moistekaart.html?vaade=${tund.id}&valitud=t:${t.id}">${A.ikoon("kaart")}Näita mõistekaardil</a></div>
      </header>
      <div class="teema-keha">
        <nav class="osad-menyy" aria-label="Teema osad"><ol>${menyy}</ol></nav>
        <div class="sisu">${sisu}
          <nav class="lehitse" aria-label="Teemade vahel">${sammud}<div class="lehitse-nupud">${link(jar, "jargmine", "Järgmine teema")}${lopp}${link(eel, "eelmine", "Eelmine teema")}</div></nav>
          <details class="tagasiside">
            <summary>Teata veast või paku parandust</summary>
            <form id="tagasiside" novalidate>
              <label>Mis osas viga on?
                <select name="osa">${koik.map((x) => `<option value="${x.id}">${A.esc(x.nimi)}</option>`).join("")}<option value="muu">Muu</option></select></label>
              <label>Mis on valesti ja kuidas peaks olema? Lisa võimalusel sätte viide.
                <textarea name="tekst" required minlength="5" maxlength="2000"></textarea></label>
              <label>Nimi (valikuline)
                <input name="nimi" maxlength="80" autocomplete="name"></label>
              <div><button class="nupp" type="submit">Saada ettepanek</button></div>
              <p class="teade" role="status" aria-live="polite"></p>
            </form>
          </details>
          
        </div>
      </div>`;

    A.seoHarjutused(leht);
    leht.addEventListener("click", (e) => { const b = e.target.closest(".naite-nupp"); if (b) A.avaNaide(t.naited, 0, b); });
    seoTagasiside(t.id);
    seoMenyy();
    if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
  }

  function naiteNupp(t, silt) {
    if (!t.naited || !t.naited.length) return "";
    return `<button type="button" class="naite-nupp" aria-haspopup="dialog">${A.esc(silt)}${t.naited.length > 1 ? ` (${t.naited.length})` : ""}</button>`;
  }

  function seoTagasiside(teema) {
    const f = document.getElementById("tagasiside");
    const teade = f.querySelector(".teade");
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const tekst = f.tekst.value.trim();
      if (tekst.length < 5) { teade.className = "teade viga"; teade.textContent = "Kirjuta vähemalt paar sõna: mis on valesti ja kuidas peaks olema."; f.tekst.focus(); return; }
      const nupp = f.querySelector("button"); nupp.disabled = true;
      teade.className = "teade"; teade.textContent = "Saadan…";
      A.saadaTagasiside({ teema, osa: f.osa.value, tekst, nimi: f.nimi.value.trim() || null })
        .then(() => { teade.className = "teade ok"; teade.textContent = "Ettepanek saadetud. Aitäh – see vaadatakse üle."; f.reset(); })
        .catch(() => { teade.className = "teade viga"; teade.textContent = "Saatmine ebaõnnestus. Kontrolli internetiühendust ja proovi uuesti."; })
        .finally(() => { nupp.disabled = false; });
    });
  }

  function seoMenyy() {
    const lingid = [...document.querySelectorAll(".osad-menyy a")];
    const kaart = new Map(lingid.map((a) => [a.getAttribute("href").slice(1), a]));
    if (!("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver((kirjed) => {
      kirjed.forEach((k) => {
        if (k.isIntersecting) {
          lingid.forEach((a) => a.classList.remove("aktiivne"));
          const a = kaart.get(k.target.id);
          if (a) { a.classList.add("aktiivne"); const ol = a.closest("ol"); if (ol.scrollWidth > ol.clientWidth) ol.scrollLeft = a.offsetLeft - 16; }
        }
      });
    }, { rootMargin: "-20% 0px -70% 0px" });
    document.querySelectorAll(".osa").forEach((s) => io.observe(s));
  }
})();
</script>
</body>
</html>
