<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aine – Õppeleht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/stiil.css?v=20261111i">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f2c230'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' font-family='Georgia' fill='%231c2733'%3E§%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="ylariba" id="ylariba"></header>

<main id="leht"><p class="vahe tyhi" style="margin-top:2rem">Laen ainet…</p></main>

<footer class="jalus">
  <p>Seaduste ja lepingute tekstid: Riigi Teataja, EUR-Lex, ÜRO – muutmata kujul. Selgitused on õppimiseks ega asenda ametlikku teksti.</p>
  <p>Leidsid vea? Ava teema ja kasuta lõpus olevat „Teata veast” vormi.</p>
</footer>

<script src="assets/seadistus.js?v=20261111i"></script>
<script src="assets/app.js?v=20261111i"></script>
<script src="assets/ikoonid.js?v=20261111i"></script>
<script src="assets/skeemid.js?v=20261111i"></script>
<script>
(function () {
  const A = window.APP;
  const aineId = new URLSearchParams(location.search).get("id") || "inimoigused";
  A.kaivita({ leht: "aine", aine: aineId });
  const leht = document.getElementById("leht");
  const luhiKp = (s) => { const d = A.paevKp(s); return d ? { p: d.getDate(), k: d.toLocaleDateString("et-EE", { month: "short" }).replace(".", ""), np: d.toLocaleDateString("et-EE", { weekday: "short" }) } : null; };
  const pikkKp = (s) => { const d = A.paevKp(s); return d ? d.toLocaleDateString("et-EE", { day: "numeric", month: "numeric" }) : ""; };

  function ajakava(aine, tt, valmisArv) {
    const tana = A.tana().getTime();
    const aeg = (t) => { const d = A.paevKp(t.kuupaev); if (!d) return "tulemas"; const x = d.getTime(); return x < tana ? "toimunud" : x === tana ? "tana" : "tulemas"; };
    const kohtumised = tt.filter((t) => t.tyyp !== "eksam");
    const toimunud = kohtumised.filter((t) => aeg(t) !== "tulemas").length;
    const jarg = tt.find((t) => aeg(t) !== "toimunud");
    const rida = (t) => {
      const a = aeg(t), kp = luhiKp(t.kuupaev);
      const liik = t.tyyp === "seminar" ? "Seminar" : t.tyyp === "eksam" ? "Eksam" : "Loeng";
      const olek = a === "tana" ? "Täna" : a === "toimunud" ? "Toimunud" : "Tulemas";
      let sisu;
      if (t.olek === "valmis") sisu = `<a class="aj-link" href="#${t.id}">Ava tund · ${t.teemad.length} teemat</a><a class="aj-link teine" href="kordamine.html?tund=${t.id}">Korda</a>`;
      else if (t.tyyp === "seminar") sisu = `<span class="aj-koht">Õpilastööde arutelu lisatakse siia</span>`;
      else if (t.tyyp === "eksam") sisu = valmisArv ? `<a class="aj-link" href="kordamine.html?aine=${aine.id}">Korda kogu ainet</a>` : "";
      else sisu = `<span class="aj-koht">${a === "tulemas" ? "Teemad lisatakse enne tundi" : "Teemad lisamisel"}</span>`;
      const ala = (t.alateemad || []).length ? `<ul class="aj-ala">${t.alateemad.map((x) => `<li>${A.esc(x)}</li>`).join("")}</ul>` : "";
      const taht = (t.tahtajad || []).length ? `<ul class="aj-taht">${t.tahtajad.map((x) => `<li class="${A.onMoodas(x.kp) ? "moodas" : ""}"><b>${pikkKp(x.kp)}</b> ${A.esc(x.nimi)}</li>`).join("")}</ul>` : "";
      return `<li id="aj-${t.id}" class="aj-rida aj-${t.tyyp || "loeng"} aj-${a}${t.olek === "valmis" ? " aj-valmis" : ""}">
        <div class="aj-kp">${kp ? `<span class="aj-np">${kp.np}</span><b>${kp.p}</b><span>${kp.k}</span>` : ""}</div>
        <div class="aj-keha"><div class="aj-pea"><span class="aj-liik">${t.tyyp === "eksam" ? "" : t.nr + ". "}${liik}${t.vorm ? " · " + A.esc(t.vorm) : ""}</span><span class="aj-olek">${olek}</span></div>
          <h3>${A.esc(t.pealkiri)}</h3>${ala}<div class="aj-sisu">${sisu}</div>${taht}</div></li>`;
    };
    const grupid = (aine.valjundid || [""]).map((v, i) => {
      const read = tt.filter((t) => (t.valjund || 1) === i + 1 && t.tyyp !== "eksam");
      return read.length ? `<section class="aj-grupp"><h3 class="aj-grupp-p"><span>${i + 1}. väljund</span>${A.esc(v)}</h3><ol class="aj-loend">${read.map(rida).join("")}</ol></section>` : "";
    }).join("");
    const eksam = tt.filter((t) => t.tyyp === "eksam");
    return `<section class="ajakava" aria-labelledby="aj-p">
      <div class="aj-ylemine"><h2 id="aj-p">Ajakava</h2>
        <p class="aj-edenemine"><span class="aj-riba" aria-hidden="true"><i style="width:${Math.round(100 * toimunud / Math.max(1, kohtumised.length))}%"></i></span>
          ${toimunud} / ${kohtumised.length} kohtumist toimunud${jarg ? ` · ${aeg(jarg) === "tana" ? "täna" : "järgmine"}: <a href="#aj-${jarg.id}">${pikkKp(jarg.kuupaev)} ${A.esc(jarg.pealkiri)}</a>` : ""}</p>
        <p class="aj-legend"><span class="aj-l aj-l-loeng">Loeng</span><span class="aj-l aj-l-seminar">Seminar</span><span class="aj-l aj-l-valmis">Teemad lehel olemas</span></p></div>
      ${grupid}
      ${eksam.length ? `<ol class="aj-loend aj-eksam-loend">${eksam.map(rida).join("")}</ol>` : ""}</section>`;
  }
  const kuup = (s) => s ? new Date(s + "T12:00:00").toLocaleDateString("et-EE", { day: "numeric", month: "long", year: "numeric" }) : "";

  A.andmed().then(({ tunnid }) => {
    const aine = tunnid.ained.find((a) => a.id === aineId);
    if (!aine) { leht.innerHTML = `<div class="vahe" style="padding-top:2rem"><h1>Ainet ei leitud</h1><p><a href="index.html">Tagasi avalehele</a></p></div>`; return; }
    document.title = `${aine.nimi} – Õppeleht`;
    const aineTunnid = tunnid.tunnid.filter((t) => t.aine === aineId);
    const valmis = aineTunnid.filter((t) => t.olek === "valmis");
    const tabs = tunnid.ained.map((a) => `<a href="aine.html?id=${a.id}"${a.id === aineId ? ' aria-current="page"' : ""}>${A.esc(a.lyhend)}</a>`).join("");

    return A.koikTeemadT().then((teemad) => {
      const kaart = {}; teemad.forEach((t) => (kaart[t.id] = t));
      const tunnidHtml = aineTunnid.filter((t) => !aine.ajakava || t.olek === "valmis").map((t) => {
        if (t.olek !== "valmis") {
          return `<section class="tund tulemas" aria-label="Tund ${t.nr}"><div class="tund-info"><div class="nr">${t.nr}</div><h2>${A.esc(t.pealkiri)}</h2></div>
            <div class="tund-sisu">${A.esc(t.kirjeldus)}</div></section>`;
        }
        const plokid = t.plokid.map((p) => `<div class="plokk"><h3>${A.esc(p.pealkiri)}</h3><ul class="teemad">${
          p.teemad.map((id) => {
            const tm = kaart[id]; if (!tm) return "";
            const otsitav = [tm.pealkiri, tm.lyhidalt, JSON.stringify(tm.osad)].join(" ").toLowerCase();
            const k = !tm.kysimused.length ? "" : tm.kysimused.length > 1 ? `küsimused ${tm.kysimused.join(", ")}` : `küsimus ${tm.kysimused[0]}`;
            const ik = tm.ikoon ? `<span class="t-ikoon">${A.ikoon(tm.ikoon)}<span class="t-nr-m" aria-hidden="true">${tm.jrk}</span></span>` : `<span class="t-nr">${tm.jrk}</span>`;
            return `<li data-otsi="${A.esc(otsitav)}"><a href="teema.html?id=${tm.id}"${tm.ikoon ? ' class="on-ikoon"' : ""}>
              ${ik}<span class="peidetud-tekst">Teema ${tm.jrk}: </span><span class="t-pealkiri">${A.esc(tm.pealkiri)}</span><span class="t-k">${k}</span>
              <span class="t-lyhidalt">${A.esc(tm.lyhidalt)}</span></a></li>`;
          }).join("")}</ul></div>`).join("");
        return `<section class="tund" aria-labelledby="tund-${t.id}">
          <div class="tund-info" id="${t.id}"><div class="nr">${t.nr}</div><h2 id="tund-${t.id}">${A.esc(t.pealkiri)}</h2>
            <div class="kp">${kuup(t.kuupaev)}</div><p>${A.esc(t.kirjeldus)}</p>
            <div class="nupud"><a class="nupp" href="kordamine.html?tund=${t.id}">Korda seda tundi</a>
            <a class="nupp teine" href="teema.html?id=${t.teemad[0].id}">Alusta esimesest teemast</a>
            <a class="kaardilink" href="moistekaart.html?vaade=${t.id}">${A.ikoon("kaart")}Tunni mõistekaart</a></div>
            ${t.materjal && t.materjal.length ? `<div class="materjal"><h3>Tunni materjal</h3><ul>${t.materjal.map((m) => `<li>${A.esc(m)}</li>`).join("")}</ul></div>` : ""}</div>
          <div class="tund-sisu">${plokid}<p class="tyhi peidetud" data-tyhi>Selle otsinguga teemasid ei leitud.</p></div></section>`;
      }).join("");

      const teemadeArv = valmis.reduce((n, t) => n + t.teemad.length, 0);
      const ajajoon = aine.ajakava ? ajakava(aine, aineTunnid, valmis.length) : "";
      leht.innerHTML = `
        <header class="aine-pais">
          <div class="murupuru"><a href="index.html">Avaleht</a> / aine</div>
          <h1>${A.esc(aine.nimi)}</h1>
          <p>${A.esc(aine.kirjeldus)}${aine.kood ? ` (${A.esc(aine.kood)})` : ""}</p>
          <p class="seis">${valmis.length} ${valmis.length === 1 ? "tund" : "tundi"} valmis, ${teemadeArv} teemat.
            ${valmis.length ? `<a href="kordamine.html?aine=${aine.id}">Korda kogu ainet</a> · <a href="moistekaart.html?vaade=aine:${aine.id}">Aine mõistekaart</a>` : ""}</p>
          <nav class="ainetabs" aria-label="Ained">${tabs}</nav>
        </header>
        ${valmis.length ? `<div class="otsing"><label for="otsi">Otsi selles aines</label>
          <input id="otsi" type="search" placeholder="nt usuvabadus, EIK, VangS § 29" autocomplete="off"></div>` : ""}
        ${ajajoon}
        ${aine.ajakava && valmis.length ? `<h2 class="jaotis-pealkiri" id="valmis-tunnid">Valmis tunnid</h2>` : ""}
        <div id="tunnid">${tunnidHtml}</div>
        ${!valmis.length && !aine.ajakava ? `<div class="tyhi-paneel">Selle aine tunde veel ei ole. Need lisatakse pärast tundi koos materjali ja kordamisküsimustega.</div>` : ""}
        ${aine.kiirotsing ? `<section class="kiirotsing" aria-labelledby="kiir-pealk"><h2 id="kiir-pealk">Põhiõigus → vangla õigusakt</h2>
          <p id="kiir-kirjeldus"></p><div id="kiirotsing"></div></section>` : ""}`;

      const otsi = document.getElementById("otsi");
      if (otsi) otsi.addEventListener("input", (e) => {
        const q = e.target.value.trim().toLowerCase().replace(/\s+/g, " ");
        document.querySelectorAll(".tund:not(.tulemas)").forEach((tund) => {
          let n = 0;
          tund.querySelectorAll("li[data-otsi]").forEach((li) => { const ok = !q || li.dataset.otsi.includes(q); li.classList.toggle("peidetud", !ok); if (ok) n++; });
          tund.querySelectorAll(".plokk").forEach((p) => p.classList.toggle("peidetud", !p.querySelector("li:not(.peidetud)")));
          const tyhi = tund.querySelector("[data-tyhi]"); if (tyhi) tyhi.classList.toggle("peidetud", n > 0);
        });
      });

      if (aine.kiirotsing) return A.lae("data/kiirotsing.json").then((k) => {
        document.getElementById("kiir-kirjeldus").textContent = k.kirjeldus;
        const rida = (r) => `<tr><th scope="row">${r.teema_id ? `<a href="teema.html?id=${r.teema_id}">${A.esc(r.teema)}</a>` : A.esc(r.teema)}</th>
          <td data-veerg="Põhiseadus ja rahvusvaheline õigus">${r.pohiseadus.map((x) => A.refNupp(x)).join(" ")}</td>
          <td data-veerg="Vangla">${r.vangla.map((x) => A.refNupp(x)).join(" ")}<span class="kiir-selg">${A.esc(r.vangla_tekst)}</span></td></tr>`;
        document.getElementById("kiirotsing").innerHTML = `<table class="s-vordlus kiir-tabel"><thead><tr><th scope="col">Põhiõigus</th><th scope="col">Põhiseadus ja rahvusvaheline õigus</th><th scope="col">Vangla</th></tr></thead><tbody>${k.read.map(rida).join("")}</tbody></table>
          <p class="kiir-allikas">${A.esc(k.allikas)}</p>`;
      });
    });
  }).catch((e) => A.viga(leht, e));
})();
</script>
</body>
</html>
